<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XCVII Protocol - Universal Swap & Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root { --gold: #e5b842; --bg: #0f1012; --card: #191b1f; --text: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 12px; }
        .card { background: var(--card); border: 1px solid #2d3139; border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: var(--gold); margin: 0; font-size: 28px; letter-spacing: 2px; }
        .stats { background: #121417; border: 1px solid #23272e; border-radius: 12px; padding: 14px; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .row:last-child { margin-bottom: 0; }
        .val { font-weight: bold; color: var(--gold); }
        .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
        .tab { flex: 1; padding: 12px; border: none; background: #23272e; color: #888; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .tab.active { background: var(--gold); color: #000; }
        .input-box { margin-bottom: 14px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #9aa0a6; }
        input, select { width: 100%; box-sizing: border-box; background: #0b0c0e; border: 1px solid #333; border-radius: 10px; padding: 14px; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: var(--gold); }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: var(--gold); color: #000; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-connect { background: #2b303a; color: #fff; margin-bottom: 12px; }
        .btn-owner { background: #d32f2f; color: #fff; margin-top: 8px; font-size: 13px; padding: 10px; border-radius: 8px; border: none; width: 100%; cursor: pointer; }
        .owner-box { display: none; margin-top: 20px; padding: 14px; border: 1px dashed #d32f2f; border-radius: 12px; background: #1a0f0f; }
        .status-dot { height: 8px; width: 8px; background-color: #00e676; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>XCVII</h1>
        <small style="color: #888;">Universal Swap • Bất kỳ đồng nào</small>
    </div>

    <button id="btnConnect" class="btn btn-connect" onclick="connectWallet()">Kết nối Ví Web3</button>

    <div class="stats">
        <div class="row"><span><span class="status-dot"></span>Giá XCVII:</span><span id="xcviiUsd" class="val">$97.00</span></div>
        <div class="row"><span>Số dư XCVII của bạn:</span><span id="userBalance" class="val" style="color:#fff;">0 XCVII</span></div>
    </div>

    <div class="tabs">
        <button id="tabBuy" class="tab active" onclick="switchMode('buy')">MUA XCVII</button>
        <button id="tabSell" class="tab" onclick="switchMode('sell')">BÁN XCVII</button>
    </div>

    <div id="buyBox">
        <div class="input-box">
            <label>Bạn muốn trả bằng đồng:</label>
            <select id="buyToken">
                <option value="BNB">BNB (Native)</option>
                <option value="USDT">USDT</option>
                <option value="0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c">BTCB (Bitcoin)</option>
                <option value="0x2170Ed0880ac9A755fd29B2688956BD959F933F8">ETH (Ethereum)</option>
                <option value="0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d">USDC</option>
            </select>
        </div>
        <div class="input-box">
            <label>Số tiền trả:</label>
            <input type="number" id="buyIn" placeholder="0.0" step="any">
        </div>
        <button class="btn" onclick="executeBuy()">SWAP NGAY</button>
    </div>

    <div id="sellBox" style="display: none;">
        <div class="input-box">
            <label>Bạn muốn nhận về đồng:</label>
            <select id="sellToken">
                <option value="BNB">BNB</option>
                <option value="USDT">USDT</option>
                <option value="0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c">BTCB (Bitcoin)</option>
                <option value="0x2170Ed0880ac9A755fd29B2688956BD959F933F8">ETH (Ethereum)</option>
                <option value="0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d">USDC</option>
            </select>
        </div>
        <div class="input-box">
            <label>Số lượng XCVII muốn bán:</label>
            <input type="number" id="sellIn" placeholder="0.0" step="any">
        </div>
        <button class="btn" onclick="executeSell()">BÁN NGAY</button>
    </div>

    <div id="ownerPanel" class="owner-box">
        <strong style="color: #ff5252; font-size: 13px;">KHU VỰC DÀNH RIÊNG CHO SẾP (OWNER)</strong>
        <button class="btn-owner" onclick="claimSurplus()">Rút tiền lãi/thặng dư về ví tôi</button>
        <button class="btn-owner" onclick="claimTeamQuota()">Rút 10 tỷ token Team về ví tôi</button>
    </div>
</div>

<script>
    const XCVII_ADDRESS = "0x1D450E9e53b4744C5e73b7C814fB0FedB63bd04B";
    const USDT_ADDRESS = "0xDaa06b2791221284bd7FE9b89991001a700D8Fbe";

    const ABI = [
        "function owner() view returns (address)",
        "function getCurrentPriceUsd() view returns (uint256)",
        "function balanceOf(address) view returns (uint256)",
        "function buyWithBnb() payable",
        "function buyWithUsdt(uint256)",
        "function buyWithAnyToken(address,uint256,uint256,address[])",
        "function sellForBnb(uint256)",
        "function sellForUsdt(uint256)",
        "function sellForAnyToken(uint256,address,uint256,address[])",
        "function withdrawSurplus(address,uint256)",
        "function unlockTeam(address,uint256)"
    ];
    const ERC20_ABI = [
        "function approve(address,uint256) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let provider, signer, contract, account, contractOwner;

    async function connectWallet() {
        if (!window.ethereum) return alert("Vui lòng mở trên Ví Web3 Binance hoặc MetaMask!");
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        account = await signer.getAddress();
        document.getElementById("btnConnect").innerText = account.substring(0,6) + "..." + account.substring(38);
        contract = new ethers.Contract(XCVII_ADDRESS, ABI, signer);

        try {
            contractOwner = await contract.owner();
            if (account.toLowerCase() === contractOwner.toLowerCase()) {
                document.getElementById("ownerPanel").style.display = "block";
            }
        } catch(e){}

        loadStats();
    }

    async function loadStats() {
        if (!contract) return;
        try {
            const p = await contract.getCurrentPriceUsd();
            document.getElementById("xcviiUsd").innerText = "$" + (ethers.utils.formatEther(p) * 1).toFixed(2);
            const b = await contract.balanceOf(account);
            document.getElementById("userBalance").innerText = (ethers.utils.formatEther(b) * 1).toLocaleString() + " XCVII";
        } catch(e) {}
    }

    function switchMode(m) {
        document.getElementById("tabBuy").className = "tab " + (m === 'buy' ? 'active' : '');
        document.getElementById("tabSell").className = "tab " + (m === 'sell' ? 'active' : '');
        document.getElementById("buyBox").style.display = m === 'buy' ? 'block' : 'none';
        document.getElementById("sellBox").style.display = m === 'sell' ? 'block' : 'none';
    }

    async function executeBuy() {
        const token = document.getElementById("buyToken").value;
        const val = document.getElementById("buyIn").value;
        if (!val || val <= 0) return alert("Nhập số tiền!");

        try {
            if (token === "BNB") {
                const tx = await contract.buyWithBnb({ value: ethers.utils.parseEther(val) });
                await tx.wait();
            } else if (token === "USDT") {
                const uContract = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, signer);
                const wei = ethers.utils.parseEther(val);
                await (await uContract.approve(XCVII_ADDRESS, wei)).wait();
                await (await contract.buyWithUsdt(wei)).wait();
            } else {
                const anyContract = new ethers.Contract(token, ERC20_ABI, signer);
                const dec = await anyContract.decimals();
                const amountIn = ethers.utils.parseUnits(val, dec);
                await (await anyContract.approve(XCVII_ADDRESS, amountIn)).wait();
                const path = [token, USDT_ADDRESS];
                await (await contract.buyWithAnyToken(token, amountIn, 0, path)).wait();
            }
            alert("Swap thành công!");
            loadStats();
        } catch(e) { alert("Lỗi: " + (e.data?.message || e.message)); }
    }

    async function executeSell() {
        const token = document.getElementById("sellToken").value;
        const val = document.getElementById("sellIn").value;
        if (!val || val <= 0) return alert("Nhập số token!");

        const wei = ethers.utils.parseEther(val);
        try {
            if (token === "BNB") {
                await (await contract.sellForBnb(wei)).wait();
            } else if (token === "USDT") {
                await (await contract.sellForUsdt(wei)).wait();
            } else {
                const path = [USDT_ADDRESS, token];
                await (await contract.sellForAnyToken(wei, token, 0, path)).wait();
            }
            alert("Bán thành công!");
            loadStats();
        } catch(e) { alert("Lỗi: " + (e.data?.message || e.message)); }
    }

    async function claimSurplus() {
        try {
            const tx = await contract.withdrawSurplus(account, ethers.utils.parseEther("0.1"));
            await tx.wait();
            alert("Đã rút tiền về ví sếp!");
        } catch(e) { alert("Lỗi: " + (e.data?.message || e.message)); }
    }

    async function claimTeamQuota() {
        try {
            const tx = await contract.unlockTeam(account, ethers.utils.parseEther("10000000000"));
            await tx.wait();
            alert("Đã nhận 10 tỷ token Team vào ví sếp!");
            loadStats();
        } catch(e) { alert("Lỗi: " + (e.data?.message || e.message)); }
    }
</script>
</body>
</html>
